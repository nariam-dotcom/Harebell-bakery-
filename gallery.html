<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakery</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>
    <section class="gallery-section">
        <div class="gallery-header">
            <h2>Our Bakery Gallery</h2>
            <p>Explore our freshly baked cakes, breads, and treats!</p>
        </div>
        <div class="gallery-search-box">
            <input type="text" id="gallery-search" placeholder="Search gallery">
        </div>
        <div class="gallery-filter-buttons">
            <button class="filter-button active" onclick="filterCategory('all')">All</button>
            <button class="filter-button" onclick="filterCategory('cakes')">Cakes</button>
            <button class="filter-button" onclick="filterCategory('breads')">Breads</button>
            <button class="filter-button" onclick="filterCategory('cookies')">Cookies</button>
            <button class="filter-button" onclick="filterCategory('pastries')">Pastries</button>
            <button class="filter-button favorite-button" onclick="showFavorites()">❤️ Favorites</button>
        </div>

    </section>
    
</body>
</html>
