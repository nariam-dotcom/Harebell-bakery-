<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakery</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>
    <section class="gallery-section">
        <div class="gallery-header">
            <h2>Our Bakery Gallery</h2>
            <p>Explore our freshly baked cakes, breads, and treats!</p>
        </div>
        <div class="gallery-search-box">
            <input type="text" id="gallery-search" placeholder="Search gallery">
        </div>
        <div class="gallery-filter-buttons">
            <button class="filter-button active" onclick="filterCategory('all')">All</button>
            <button class="filter-button" onclick="filterCategory('cakes')">Cakes</button>
            <button class="filter-button" onclick="filterCategory('breads')">Breads</button>
            <button class="filter-button" onclick="filterCategory('cookies')">Cookies</button>
            <button class="filter-button" onclick="filterCategory('pastries')">Pastries</button>
            <button class="filter-button favorite-button" onclick="showFavorites()">❤️ Favorites</button>
        </div>
        <div id="gallery-grid" class="gallery-grid">
  </div>
  <div id="lightbox" class="lightbox">
    <span class="close-button" onclick="closeLightbox()">&times;</span>
    <div class="lightbox-content">
        <button class="prev-button" onclick="navigateImage(-1)">&#10094;</button>
        <div class="lightbox-card">
            <img id="lightbox-img" src="" alt="Gallery Preview">
            <div class="lightbox-details">
                <h3 id="lightbox-title"></h3>
                <span id="lightbox-tag">Category</span>
                <p id="lightbox-description"></p>
                <button id="lightbox-favorite-button">❤️Favorite</button>
            </div>
        </div>
        <button class="next-button" onclick="navigateImage(1)">&#10095</button>
    </div>
  </div>

    </section>
    
</body>
</html>
